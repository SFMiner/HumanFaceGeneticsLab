<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDFC4"/>
      <stop offset="100%" style="stop-color:#F0C8A0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" fill="#2E5C1E" rx="16"/>
  <!-- Face silhouette -->
  <ellipse cx="64" cy="58" rx="32" ry="40" fill="url(#faceGrad)"/>
  <!-- Eyes -->
  <ellipse cx="52" cy="52" rx="6" ry="4" fill="#3E2723"/>
  <ellipse cx="76" cy="52" rx="6" ry="4" fill="#3E2723"/>
  <circle cx="52" cy="52" r="2" fill="white"/>
  <circle cx="76" cy="52" r="2" fill="white"/>
  <!-- DNA helix symbol -->
  <path d="M30 100 Q40 90, 50 100 Q60 110, 70 100 Q80 90, 90 100" stroke="#5B9BD5" stroke-width="3" fill="none"/>
  <path d="M30 110 Q40 100, 50 110 Q60 120, 70 110 Q80 100, 90 110" stroke="#FFB6C1" stroke-width="3" fill="none"/>
  <!-- Cross connections -->
  <line x1="40" y1="95" x2="40" y2="115" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="60" y1="95" x2="60" y2="115" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="80" y1="95" x2="80" y2="115" stroke="#FFFFFF" stroke-width="2"/>
</svg>
